# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and Tests Python app to Healthy Main - conecacesar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: conecta-cesar/requirements.txt

      # No venv here on purpose — a GitHub Actions runner is already an
      # isolated, disposable environment, so a venv on top of it buys
      # nothing (and the previous "activate" here didn't actually persist
      # to later steps anyway — each `run:` block is its own shell).
      - name: Install Python dependencies
        run: |
          cd conecta-cesar
          pip install -r requirements.txt

      - name: Run Django tests
        run: |
          cd conecta-cesar
          python manage.py test
        env:
          TARGET_ENV: Dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: conecta-cesar/package-lock.json

      - name: Install Cypress
        run: |
          cd conecta-cesar
          npm ci

      - name: Run E2E tests
        run: |
          cd conecta-cesar
          rm -f db.sqlite3
          python manage.py migrate
          python manage.py seed_cypress_data
          # DISABLE_DEBUG_TOOLBAR: the toolbar's floating "Hide »" button
          # overlaps nav elements and breaks Cypress's cy.click() — see
          # project_cc/settings.py.
          DISABLE_DEBUG_TOOLBAR=1 python manage.py runserver 127.0.0.1:8000 &
          sleep 5
          npx cypress run
        env:
          TARGET_ENV: Dev
